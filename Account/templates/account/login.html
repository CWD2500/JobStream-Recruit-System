{% extends "layouts/basic.html" %}
{% load static %}
{% block content %}

<style>
/* إعدادات الأساس */
body {
    background-color: white;
}

.login-container:hover {
    transition: .5s;
    box-shadow: 0px 0px 12px green;
}

.login-container {
    direction: rtl;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    margin-top: 80px;
    border: 1px solid #28a745;
}

.login-title {
    font-size: 24px;
    color: #28a745;
    margin-bottom: 20px;
    text-align: center;
}

.login-form {
    display: flex;
    flex-direction: column;
}

.form-floating {
    position: relative;
    margin-bottom: 15px;
}

.form-floating input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #28a745;
    border-radius: 5px;
    width: 100%;
}

.form-floating input:focus {
    border-color: #28a745;
    outline: none;
}

.form-floating label {
    position: absolute;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    transition: all 0.3s ease-in-out;
    color: #6c757d;
   
    width: 100px;
    background: none;
    padding: 0 5px;
}

.form-floating input:focus + label,
.form-floating input:not(:placeholder-shown) + label {
    top: 0;
    left: 10px;
    font-size: 15px;
    color: #28a745;
}

.login-btn {
    padding: 10px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background-color: #218838;
}

.forgot-password {
    text-align: left;
    margin-top: 10px;
}

.forgot-password a {
    color: #28a745;
    font-size: 14px;
    text-decoration: none;
}

.forgot-password a:hover {
    text-decoration: underline;
}

.register-link {
    text-align: center;
    margin-top: 10px;
}

.register-link p {
    font-size: 14px;
}

.register-link a {
    color: #28a745;
    text-decoration: none;
}

.register-link a:hover {
    text-decoration: underline;
}
</style>

<div class="login-container">
    <h2 class="login-title">تسجيل الدخول</h2>
    <form method="POST" class="login-form">
        {% csrf_token %}
        
        <div class="form-floating">
            {{ form.email }}
            <label for="id_username">البريد الالكتروني</label>
        </div>

        <div class="form-floating">
            {{ form.password }}
            <label for="id_password">كلمة المرور</label>
        </div>

        <button type="submit" class="login-btn">دخول</button>
        <div class="forgot-password">
            <a href="{%  url 'reset_password' %}">هل نسيت كلمة السر؟</a>
        </div>
        <div class="register-link">
            <p>ليس لديك حساب؟ <a href="{% url 'register' %}" style="color: blue;">إنشاء حساب</a></p>
        </div>
    </form>
</div>

{% endblock %}
